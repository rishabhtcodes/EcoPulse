services:
  - type: web
    name: ecopulse-india
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed_data
    startCommand: gunicorn ecopulse.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DEBUG
        value: 'True'
